name: Build Releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Strategy: bundle a standalone Python + pygame + all game files together.
# We use PyInstaller to bundle ONLY the menu as the entry point, but include
# all game .py files as data. At runtime the menu launches games using the
# bundled Python interpreter (sys.executable inside the bundle points to
# the real Python, not the frozen app).

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pyinstaller Pillow

      - name: Convert icon to icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Write PyInstaller spec
        run: |
          cat > GamesCollection.spec << 'SPEC'
          # -*- mode: python ; coding: utf-8 -*-
          import glob, os
          
          # Collect all game .py files and word lists as data
          datas = []
          for f in glob.glob('*.py'):
              datas.append((f, '.'))
          for f in glob.glob('*.txt'):
              datas.append((f, '.'))
          datas.append(('icon.png', '.'))
          
          a = Analysis(
              ['menu.py'],
              pathex=[],
              binaries=[],
              datas=datas,
              hiddenimports=['pygame'],
              hookspath=[],
              runtime_hooks=[],
              excludes=[],
          )
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [],
              exclude_binaries=True,
              name='GamesCollection',
              icon='icon.icns',
              console=False,
              windowed=True,
          )
          coll = COLLECT(exe, a.binaries, a.zipfiles, a.datas,
              name='GamesCollection',
          )
          app = BUNDLE(coll,
              name='GamesCollection.app',
              icon='icon.icns',
              bundle_identifier='com.scottvedder.gamescollection',
          )
          SPEC

      - name: Build Mac app
        run: pyinstaller GamesCollection.spec

      - name: Zip Mac app
        run: cd dist && zip -r GamesCollection-mac.zip "GamesCollection.app"

      - name: Upload Mac release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GamesCollection-mac.zip

  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pyinstaller Pillow

      - name: Write PyInstaller spec
        shell: python
        run: |
          import glob
          datas = []
          for f in glob.glob('*.py'):
              datas.append(f"('{f}', '.')")
          for f in glob.glob('*.txt'):
              datas.append(f"('{f}', '.')")
          datas.append("('icon.png', '.')")
          datas_str = '[' + ', '.join(datas) + ']'

          spec = f"""# -*- mode: python ; coding: utf-8 -*-
          a = Analysis(
              ['menu.py'],
              pathex=[],
              binaries=[],
              datas={datas_str},
              hiddenimports=['pygame'],
              hookspath=[],
              runtime_hooks=[],
              excludes=[],
          )
          pyz = PYZ(a.pure)
          exe = EXE(pyz, a.scripts, [],
              exclude_binaries=True,
              name='GamesCollection',
              icon='icon.png',
              console=False,
              windowed=True,
          )
          coll = COLLECT(exe, a.binaries, a.zipfiles, a.datas,
              name='GamesCollection',
          )
          """
          open('GamesCollection.spec', 'w').write(spec)

      - name: Build Windows app
        run: pyinstaller GamesCollection.spec

      - name: Zip Windows app
        run: cd dist && Compress-Archive -Path GamesCollection -DestinationPath GamesCollection-windows.zip

      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GamesCollection-windows.zip
